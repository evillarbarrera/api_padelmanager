name: Deploy API to Hosting (DEV / PRD)

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

jobs:
  deploy-api:
    name: Sincronizar API a Ferozo (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔍 Determinar Carpeta de Destino
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "dir=/public_html/api/dev/" >> $GITHUB_OUTPUT
            echo "env=DEV" >> $GITHUB_OUTPUT
          else
            echo "dir=/public_html/api/prd/" >> $GITHUB_OUTPUT
            echo "env=PRD" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Sincronizar API a Ferozo (${{ steps.target.outputs.env }})
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${{ secrets.SFTP_USERNAME || 'c2632100' }},${{ secrets.SFTP_PASSWORD }}" -p 21 ${{ secrets.SFTP_SERVER || 'c2632100.ferozo.com' }} << 'EOF'
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data no
          set ssl:verify-certificate no
          set net:timeout 60
          set net:max-retries 3
          mirror -R --verbose \
            --exclude-glob .git/ \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob resp/** \
            --exclude-glob scratch/** \
            --exclude-glob *.log \
            --exclude-glob *.zip \
            --exclude-glob *.tar.gz \
            ./ ${{ steps.target.outputs.dir }}
          quit
          EOF
